# Managed by Codex-Harness Bridge. Do not edit in place.
# This profile keeps the headless host while moving model-facing capabilities
# behind the bridge-owned minimal preset.

# Remove the base bundle's process-global agent tool plane. The mounted preset
# below supplies only the intentionally disclosed tools for this one agent.

# Headless controller tasks do not need an LLM-generated session title. The
# stock first-prompt title provider re-frames the complete bounded task inside
# a tool-less auxiliary request; disabling it removes that avoidable model call
# and prevents it from being confused with the first mutating Agent request.
- id: session-title-llm
  disabled: true

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: codex-bridge-minimal

# Disable the stock one-shot runner, then add the bridge-owned runner under a
# distinct id. Cordis patch `name` is an identity guard, not a replacement
# field; attempting to change the plugin name on `headless-runner` is skipped.
- id: headless-runner
  disabled: true

- insert:
    - id: codex-bridge-headless-runner
      name: ./bridge-headless-runner.mjs
      inject: [headlessStartup, agentDefaultModel, agents, sessions, agentPresets, tools, systemPrompt, llm]
      config:
        task: !!js ctx.headlessStartup.task
        presetId: codex-bridge-minimal
