name: strict-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_provider_smoke:
        description: Run the protected current-revision DeepSeek smoke on the qualified self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: strict-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-local-gates:
    name: strict-local-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: current
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: current/bridge/package-lock.json
      - name: Install and validate Bubblewrap
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap_probe() {
            bwrap \
              --die-with-parent --new-session \
              --unshare-all --unshare-user --disable-userns --assert-userns-disabled \
              --cap-drop ALL --clearenv \
              --dir /usr --ro-bind /usr /usr \
              --symlink usr/bin /bin --symlink usr/sbin /sbin \
              --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
              --proc /proc --dev /dev \
              -- /bin/true
          }
          if ! bwrap_probe; then
            # Ubuntu 24 hosted runners can install bwrap 0.9 without an
            # AppArmor user-namespace profile. Limit the compatibility change
            # to this disposable CI VM, then require the exact probe to pass.
            test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.unprivileged_userns_clone=1
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap_probe
      - name: Validate root governance and candidate gate
        run: |
          test "$(jq -r .canonicalSource ../release-status.json)" = current/
          test "$(jq -r .version ../release-status.json)" = "$(jq -r .version release-status.json)"
          jq -e . ../AUDIT_FINDINGS.json ../SOURCE_PROVENANCE.json release-status.json SOURCE_PROVENANCE.json schemas/*.json config/*.json >/dev/null
          node scripts/release-gate.test.mjs
          case "$(jq -r .releaseStatus release-status.json)" in
            candidate) node scripts/verify-release-gate.mjs --root . --audit-candidate ;;
            stable) node scripts/verify-release-gate.mjs --root . ;;
            *) exit 1 ;;
          esac
      - name: Reproducible dependency install
        working-directory: current/bridge
        run: npm ci
      - name: Verify public-history Owner acceptance and zero-gitlink gates
        working-directory: .
        run: |
          node scripts/public-repository-history-audit.test.mjs
          node current/scripts/release-structure.test.mjs
          node scripts/public-repository-history-audit.mjs \
            --root . \
            --output "$RUNNER_TEMP/public-repository-history-audit.json" \
            --owner-acceptance current/evidence/PUBLIC_HISTORY_OWNER_ACCEPTANCE.json \
            --baseline-audit current/evidence/PUBLIC_REPOSITORY_HISTORY_AUDIT_BASELINE_2026-08-26.json \
            --fail-on-blockers
          node scripts/public-history-risk-acceptance.mjs \
            --root . \
            --audit "$RUNNER_TEMP/public-repository-history-audit.json" \
            --output "$RUNNER_TEMP/public-history-risk-acceptance.json"
          node current/scripts/verify-release-structure.mjs --active-source current
      - name: Reject credentials, environment files, and nested workflows
        run: |
          test ! -e .github/workflows/ci.yml
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.(example|sample|template|dist)$'; then exit 1; fi
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----)' -- . ':!scripts/fake-dsh.mjs'; then exit 1; fi
      - name: Strict TypeScript build
        working-directory: current/bridge
        run: npm run build
      - name: Prepare exact pinned Harness for managed-profile fixture
        working-directory: .
        run: |
          # The provenance hash includes Unix mode bits. Fix the build umask so
          # identical source does not hash differently across runner defaults.
          umask 0002
          HARNESS_ROOT="$RUNNER_TEMP/deepseek-harness"
          PROFILE_MODULES="$RUNNER_TEMP/profile-modules"
          HARNESS_COMMIT="$(jq -r .pinnedHarnessCommit current/config/config.example.json)"
          git init -q "$HARNESS_ROOT"
          git -C "$HARNESS_ROOT" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$HARNESS_ROOT" fetch --depth=1 origin "$HARNESS_COMMIT"
          git -C "$HARNESS_ROOT" checkout -q --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --dir "$HARNESS_ROOT" install --frozen-lockfile
          pnpm --dir "$HARNESS_ROOT" run build
          ACTUAL_HARNESS_BUILD_SHA256="$(node current/scripts/hash-tree.mjs "$HARNESS_ROOT/apps/cli/lib")"
          EXPECTED_HARNESS_BUILD_SHA256="$(jq -r .pinnedHarnessBuildSha256 current/config/config.example.json)"
          if [[ "$ACTUAL_HARNESS_BUILD_SHA256" != "$EXPECTED_HARNESS_BUILD_SHA256" ]]; then
            echo "::error::Pinned Harness build hash mismatch: expected=$EXPECTED_HARNESS_BUILD_SHA256 actual=$ACTUAL_HARNESS_BUILD_SHA256"
            exit 1
          fi
          mkdir -p "$PROFILE_MODULES/@deepseek-ai"
          ln -s "$HARNESS_ROOT/apps/cli/node_modules/@deepseek-ai/cordis-plugin-hmr/node_modules/@deepseek-ai/schemastery" "$PROFILE_MODULES/@deepseek-ai/schemastery"
          ln -s "$HARNESS_ROOT/apps/cli/node_modules/@deepseek-ai/dsh-agent-tool-presentation/node_modules/@deepseek-ai/dsh-tools" "$PROFILE_MODULES/@deepseek-ai/dsh-tools"
          printf 'CODEX_HARNESS_FIXTURE_HARNESS_ROOT=%s\nCODEX_HARNESS_FIXTURE_PROFILE_MODULES=%s\n' "$HARNESS_ROOT" "$PROFILE_MODULES" >> "$GITHUB_ENV"
      - name: Provider capability and ignored-poisoning negatives
        working-directory: current/bridge
        run: node --test dist/test/harness-isolation.test.js dist/test/provider-protocol-fail-fast.test.js dist/test/verification-isolation.test.js dist/test/security.test.js
      - name: Full unit and component regression
        working-directory: current/bridge
        run: npm test
      - name: Process E2E
        working-directory: current/bridge
        run: node dist/direct-acceptance.js
      - name: Real managed-profile dynamic fixture with mock Provider
        working-directory: current/bridge
        run: node dist/dynamic-profile-fixture.js
      - name: stdio MCP acceptance
        working-directory: current/bridge
        run: node dist/acceptance-client.js
      - name: Security acceptance
        run: scripts/security-acceptance.sh
      - name: Skill validation
        run: node scripts/validate-skill.mjs skills/codex-harness
      - name: Transactional install, rollback, reinstall, and uninstall
        env:
          CODEX_HARNESS_PACKAGE_SKIP_PROCESS_E2E: "1"
        run: scripts/package-acceptance.sh
      - name: Generated dist and manifest drift
        run: |
          node scripts/update-manifest.mjs .
          node scripts/verify-manifest.mjs --root . --require-git-exact
          git diff --exit-code -- bridge/dist MANIFEST_SHA256.txt
      - name: Root Manifest fault-injection matrix
        working-directory: .
        run: node scripts/root-manifest.test.mjs
      - name: Root Manifest exact tracked-set verification
        working-directory: .
        run: |
          node scripts/verify-root-manifest.mjs
          git diff --exit-code -- MANIFEST_SHA256.txt

  protected-real-provider-smoke:
    name: protected-real-provider-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.real_provider_smoke
    needs: strict-local-gates
    runs-on: [self-hosted, linux, codex-harness-provider, ephemeral]
    timeout-minutes: 45
    environment: deepseek-provider-smoke
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact-id: ${{ steps.upload-provider-evidence.outputs.artifact-id }}
      artifact-url: ${{ steps.upload-provider-evidence.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload-provider-evidence.outputs.artifact-digest }}
      attestation-id: ${{ steps.attest-provider-evidence.outputs.attestation-id }}
      attestation-url: ${{ steps.attest-provider-evidence.outputs.attestation-url }}
      cryptographic-verification-sha256: ${{ steps.verify-provider-attestation.outputs.verification-sha256 }}
    defaults:
      run:
        working-directory: current
    steps:
      - name: Require ephemeral runner and tmpfs credential contract
        working-directory: .
        env:
          RUNNER_EPHEMERAL: ${{ vars.RUNNER_EPHEMERAL }}
          DEEPSEEK_API_KEY_EXPIRES_AT: ${{ secrets.DEEPSEEK_API_KEY_EXPIRES_AT }}
        run: |
          test "$RUNNER_EPHEMERAL" = true
          test "$(findmnt -n -o FSTYPE /dev/shm)" = tmpfs
          python3 - "$DEEPSEEK_API_KEY_EXPIRES_AT" <<'PY'
          import datetime,sys
          expiry=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          now=datetime.datetime.now(datetime.timezone.utc)
          seconds=(expiry-now).total_seconds()
          if not 120 < seconds <= 3600:
              raise SystemExit('Provider credential expiry must be 2-60 minutes in the future')
          PY
      - name: Checkout exact qualified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: current/bridge/package-lock.json
      - name: Build exact revision
        working-directory: current/bridge
        run: npm ci && npm run build
      - name: Prove controlled host resource ceilings
        working-directory: current/bridge
        env:
          CODEX_HARNESS_REQUIRE_CONTROLLED_RESOURCES: "1"
        run: node --test dist/test/resource-controls.test.js
      - name: Prepare protected credential file
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CREDENTIAL_FILE: /dev/shm/codex-harness-${{ github.run_id }}-${{ github.run_attempt }}.yaml
        run: |
          test -n "$DEEPSEEK_API_KEY"
          umask 077
          test "$(findmnt -n -o FSTYPE /dev/shm)" = tmpfs
          printf 'DEEPSEEK_API_KEY: %s\n' "$DEEPSEEK_API_KEY" > "$CREDENTIAL_FILE"
          test "$(stat -c '%a' "$CREDENTIAL_FILE")" = 600
      - name: Current-revision Flash and Pro smoke
        env:
          CODEX_REAL_SMOKE_CREDENTIALS: /dev/shm/codex-harness-${{ github.run_id }}-${{ github.run_attempt }}.yaml
          CODEX_REAL_SMOKE_HARNESS_ROOT: ${{ vars.HARNESS_ROOT }}
          CODEX_REAL_SMOKE_PROFILE_MODULES: ${{ vars.DSH_PROFILE_MODULES }}
          CODEX_REAL_SMOKE_EVIDENCE_PATH: ${{ github.workspace }}/current/evidence/02_CURRENT_REVISION_REAL_PROVIDER_REDACTED.json
        run: |
          test -n "$CODEX_REAL_SMOKE_HARNESS_ROOT"
          test -n "$CODEX_REAL_SMOKE_PROFILE_MODULES"
          test "$(jq -r .version bridge/package.json)" = 0.6.6
          node bridge/dist/real-provider-smoke.js
          jq -e '.result == "PASS" and .version == "0.6.6" and .currentRevision == true and (.hostResourceProfiles | length == 4) and ([.hostResourceProfiles[].controlledUseAllowed] | all)' evidence/02_CURRENT_REVISION_REAL_PROVIDER_REDACTED.json >/dev/null
      - name: Build deterministic redacted Provider evidence subject
        env:
          CREDENTIAL_FILE: /dev/shm/codex-harness-${{ github.run_id }}-${{ github.run_attempt }}.yaml
          EVIDENCE_FILE: ${{ github.workspace }}/current/evidence/02_CURRENT_REVISION_REAL_PROVIDER_REDACTED.json
          EVIDENCE_BUNDLE: ${{ runner.temp }}/codex-harness-provider-evidence
          EVIDENCE_SUBJECT: ${{ runner.temp }}/codex-harness-provider-evidence-${{ github.sha }}.tar
        run: |
          rm -rf "$EVIDENCE_BUNDLE"
          mkdir -p "$EVIDENCE_BUNDLE"
          HEAD_TREE="$(git -C .. rev-parse 'HEAD^{tree}')"
          python3 - "$EVIDENCE_FILE" "$CREDENTIAL_FILE" "$EVIDENCE_BUNDLE/provider-smoke.json" "$EVIDENCE_BUNDLE/run-binding.json" "${{ github.repository }}" "${{ github.sha }}" "$HEAD_TREE" "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.workflow_ref }}" <<'PY'
          import hashlib,json,os,sys
          evidence_path,credential_path,copy_path,binding_path,repository,head_sha,head_tree,run_id,run_attempt,workflow_ref=sys.argv[1:]
          raw=open(evidence_path,'rb').read()
          credential=open(credential_path,encoding='utf-8').read().partition(':')[2].strip().encode()
          if len(credential)<24 or credential in raw:
              raise SystemExit('Provider evidence redaction validation failed')
          evidence=json.loads(raw)
          profiles=evidence.get('hostResourceProfiles',{})
          if evidence.get('result')!='PASS' or evidence.get('sourceCommit')!=head_sha or len(profiles)!=4 or not all(v.get('controlledUseAllowed') is True for v in profiles.values()):
              raise SystemExit('Provider evidence exact-revision/resource binding failed')
          open(copy_path,'wb').write(raw)
          workflow_path=os.path.realpath('../.github/workflows/ci.yml')
          binding={
              'schemaVersion':1,'result':'PASS','repository':repository,'headSha':head_sha,'headTree':head_tree,
              'runId':int(run_id),'runAttempt':int(run_attempt),'workflowRef':workflow_ref,
              'workflowPath':'.github/workflows/ci.yml',
              'workflowSha256':hashlib.sha256(open(workflow_path,'rb').read()).hexdigest(),
              'environment':'deepseek-provider-smoke','job':'protected-real-provider-smoke',
              'providerEvidenceSha256':hashlib.sha256(raw).hexdigest(),
          }
          open(binding_path,'w',encoding='utf-8').write(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$EVIDENCE_BUNDLE" -cf "$EVIDENCE_SUBJECT" .
          sha256sum "$EVIDENCE_SUBJECT" > "$EVIDENCE_SUBJECT.sha256"
      - name: Remove protected credential material
        if: always()
        working-directory: .
        env:
          CREDENTIAL_FILE: /dev/shm/codex-harness-${{ github.run_id }}-${{ github.run_attempt }}.yaml
        run: |
          if [[ -f "$CREDENTIAL_FILE" ]]; then
            size="$(stat -c '%s' "$CREDENTIAL_FILE")"
            dd if=/dev/zero of="$CREDENTIAL_FILE" bs=1 count="$size" conv=notrunc status=none
            rm -f "$CREDENTIAL_FILE"
          fi
      - name: Upload immutable Provider evidence subject
        id: upload-provider-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/codex-harness-provider-evidence-${{ github.sha }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Verify uploaded artifact digest
        env:
          UPLOADED_DIGEST: ${{ steps.upload-provider-evidence.outputs.artifact-digest }}
          EVIDENCE_SUBJECT: ${{ runner.temp }}/codex-harness-provider-evidence-${{ github.sha }}.tar
        run: test "$UPLOADED_DIGEST" = "$(sha256sum "$EVIDENCE_SUBJECT" | awk '{print $1}')"
      - name: Attest Provider evidence subject with GitHub OIDC
        id: attest-provider-evidence
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/codex-harness-provider-evidence-${{ github.sha }}.tar
      - name: Cryptographically verify GitHub/Sigstore attestation
        id: verify-provider-attestation
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SUBJECT: ${{ runner.temp }}/codex-harness-provider-evidence-${{ github.sha }}.tar
          VERIFICATION_PROOF: /dev/shm/codex-harness-attestation-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          gh attestation verify --help >/dev/null
          verified=0
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "$EVIDENCE_SUBJECT" --repo "${{ github.repository }}" --format json > "$VERIFICATION_PROOF"; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = 1
          jq -e 'if type == "array" then length > 0 else type == "object" and length > 0 end' "$VERIFICATION_PROOF" >/dev/null
          printf 'verification-sha256=%s\n' "$(sha256sum "$VERIFICATION_PROOF" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          rm -f "$VERIFICATION_PROOF"
